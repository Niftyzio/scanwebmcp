version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Breaking upgrades need an explicit migration review. Security updates
    # remain enabled independently in the repository settings.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    rebase-strategy: auto
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
